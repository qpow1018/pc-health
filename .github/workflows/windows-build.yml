name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    name: Build Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run sensor helper tests
        run: dotnet test src-tauri/helpers/sensor-helper-tests/PcHealth.SensorHelper.Tests.csproj

      - name: Build sensor helper
        run: npm run build:sensor-helper

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Smoke test persistent sensor helper
        shell: pwsh
        run: ./scripts/test-sensor-helper.ps1

      - name: Build and upload Windows artifact
        uses: tauri-apps/tauri-action@v0.6.2
        with:
          tauriScript: npm run tauri

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: pc-health-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
